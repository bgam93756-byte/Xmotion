name: Build Android app (.apk)

# Builds Xmotion.apk on a Linux runner. Download it from the run's Artifacts,
# open it on your phone and allow installing apps from your browser or files app.
# See README → "Install on Android".
on:
  workflow_dispatch:
  push:
    branches: ['**', '!gh-pages']
    tags: ['v*']
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write

# A newer push supersedes an in-flight build of the same branch.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Test and build web app
        run: |
          npm test
          npm run build

      - name: Sync web build into the Android project
        run: npx cap sync android

      # Optional: sign with your own private key instead of the public sideload key.
      # Add the repository secrets XMOTION_KEYSTORE_BASE64, XMOTION_KEYSTORE_PASSWORD,
      # XMOTION_KEY_ALIAS and XMOTION_KEY_PASSWORD (see README).
      - name: Use private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.XMOTION_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "XMOTION_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          XMOTION_KEYSTORE_PASSWORD: ${{ secrets.XMOTION_KEYSTORE_PASSWORD }}
          XMOTION_KEY_ALIAS: ${{ secrets.XMOTION_KEY_ALIAS }}
          XMOTION_KEY_PASSWORD: ${{ secrets.XMOTION_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Xmotion.apk
          ls -lh ../Xmotion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Xmotion-apk
          path: Xmotion.apk
          retention-days: 30

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Xmotion.apk
